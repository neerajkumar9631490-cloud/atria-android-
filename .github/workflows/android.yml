name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # NOTE: do NOT use android-actions/setup-android here — its default
      # `tools` package is obsolete and makes sdkmanager exit 1.
      # ubuntu-latest already ships the Android SDK; just accept licenses
      # and make sure the packages AGP needs are present.
      - name: Setup Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          "$SDKMANAGER" --list_installed || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk atria-debug.apk
          ls -lh atria-debug.apk app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: atria-debug-apk
          path: |
            atria-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
